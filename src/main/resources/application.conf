port = 8080
port = ${?CATALOG_SERVICE_PORT}

metrics-port = 9090
metrics-port = ${?CATALOG_SERVICE_METRICS_PORT}

service-name = "catalog-service"
service-name = ${?CATALOG_SERVICE_NAME}

postgres {
  host = "localhost"
  host = ${?POSTGRES_HOST}
  port = 5432
  port = ${?POSTGRES_PORT}
  database = "catalog"
  database = ${?POSTGRES_DB}
  user = "catalog"
  user = ${?POSTGRES_USER}
  password = "catalog"
  password = ${?POSTGRES_PASSWORD}
}

# Catalog-list cache (US-1.2). Cache-aside, TTL-only freshness - no explicit
# invalidation on write (create/update/delete), so a write can take up to
# list-ttl-seconds to show up in a cached page.
redis {
  uri = "redis://localhost:6379"
  uri = ${?REDIS_URI}
  list-ttl-seconds = 60
  list-ttl-seconds = ${?CATALOG_LIST_CACHE_TTL_SECONDS}
}

# example-client is not read by the live service (catalog-service has no
# outbound call to make) - it exists only so ClientResilienceExampleSuite can
# demonstrate loading a purerest ResilienceConfig via PureConfig, the same way
# a real downstream-calling client's config would be loaded in Main. See
# README's "Calling other services with resilience".
example-client {
  retry {
    max-retries = 5
    base-delay = 1ms
  }
  circuit-breaker {
    failure-threshold = 10
    reset-timeout = 1h
  }
}
